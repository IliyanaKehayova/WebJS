<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/form.css">
    <script src="assets/js/form.js" defer></script>
    <title>Formulaire de devis</title>
</head>
<body>


    <h1>Formulaire de devis</h1>
    <fieldset>
        <legend>Coordonnées entreprise demande :</legend>
            <p id="errorParagraphe"></p>
            <form action="#" method="get" enctype="multipart/form-data" id="form">
                
                <div class="divIdentity">
                    <input type="text" placeholder="Prénom" name="firstName" id="firstName" pattern="[a-zA-Zàâäéèêëîïôöùûüç'-]{3,60}" required>
                    <input type="text" placeholder="Nom" name="lastName" id="lastName" pattern="[a-zA-Zàâäéèêëîïôöùûüç'-]{3,60}" required>
                </div>

                <div class="divMail">
                <input type="email" name="mail" id="mail" placeholder="Email" required>
                </div>

                <div class="divInfo">
                    <input type="tel" name="phone" id="phone" placeholder="Tél." pattern="0[1-7|9][0-9]{8}" required>
                    <input type="text" name="company" id="company" placeholder="Société/Colléctivité">
                </div>

                <div class="divMessage">
                <textarea name="message" id="message" rows="4" placeholder="Message" maxlength="3000"></textarea>
                </div>

                <div class="divPrescriptor">
                    <p>Comment avez-vous connu notre agence ?</p>
                    <select id="prescriptor" name="prescriptor">
                        <option value="1" selected>--merci de sélectionner une option--</option>
                    </select>
                </div>

                <div class="divProjet">
                    <p>Vous êtes intéressé par</p>
                    <select id="projet" name="projet">
                        <option value="0" selected>--merci de sélectionner une option--</option>
                    </select>
                </div>

                <div class="divCheckbox">
                    <input type="checkbox" id="autorisation" name="autorisation">
                    <label>En envoyant ce formulaire, vous authorisez la société à utiliser vos données uniquement dans le cadre du traitement de votre demande. Elles ne seront en aucun cas utilisées à d'autres fins que celles de vous recontacter.</label>
                </div>

                <button type="submit" id="submitBtn">ENVOYER</button>

            </form>


    </fieldset>
    
</body>
</html>
